name: Deploy to AWS Lightsail

# Manual only: GitHub → Actions → "Deploy to AWS Lightsail" → Run workflow (branch: main).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightsail-deploy
  cancel-in-progress: false

jobs:
  tests:
    name: Research test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qem-bench
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - name: pytest (unit, integration, scientific validation, reproducibility)
        run: uv run pytest tests -q

  deploy:
    name: Build, smoke-test and deploy
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      SERVICE_NAME: ${{ vars.LIGHTSAIL_SERVICE_NAME }}
      SERVICE_POWER: ${{ vars.LIGHTSAIL_POWER }}
      DB_NAME: ${{ vars.DB_NAME }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      MONGO_URL: ${{ secrets.MONGO_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=0
          for v in AWS_REGION SERVICE_NAME SERVICE_POWER DB_NAME CORS_ORIGINS MONGO_URL ADMIN_PASSWORD JWT_SECRET AWS_DEPLOY_ROLE_ARN; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository variable or secret: $v"; missing=1; fi
          done
          exit $missing

      - uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: qem-bench:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image before it goes live
        run: |
          docker run -d --name qem --network host \
            -e MONGO_URL=mongodb://127.0.0.1:27017 -e DB_NAME=ci_smoke \
            -e ADMIN_PASSWORD=ci-smoke-password -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e CORS_ORIGINS=http://127.0.0.1:8000 qem-bench:latest
          bash deploy/ci/smoke_test.sh http://127.0.0.1:8000 ci-smoke-password || { docker logs qem; exit 1; }
          docker rm -f qem

      - name: Sign in to AWS (OpenID Connect, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install lightsailctl
        run: |
          sudo curl -fsSL https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Push image and deploy
        id: release
        run: bash deploy/lightsail/deploy.sh release

      - name: Check the live site
        run: bash deploy/ci/smoke_test.sh "${{ steps.release.outputs.url }}" "$ADMIN_PASSWORD" --no-run
