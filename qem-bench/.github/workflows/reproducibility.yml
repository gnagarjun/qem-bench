name: reproducibility
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --extra dev
      - run: uv run pytest tests/reproducibility -q
      - name: smoke profile end-to-end + dataset validation
        run: uv run python scripts/run_experiment.py --profile smoke --out /tmp/ci_runs
      - name: analysis pipeline on the bundled demonstration dataset
        run: uv run python scripts/analyze_results.py --run data/reference/demo/run --out /tmp/ci_agg
