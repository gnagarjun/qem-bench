# Experiment profiles. Each profile is a list of blocks; a block crosses its instances x noise x shots
# for all listed methods and both resource comparisons (A: equal primary shots, B: equal total budget).
profiles:
  smoke:
    repetitions: 5
    blocks:
      - name: smoke
        purpose: CI smoke test of the full pipeline
        instances: [bell_cx, ghz_3, qaoa_n4_p1]
        noise: [{base: moderate}]
        shots: smoke

  pilot:
    repetitions: 30
    blocks:
      - name: pilot_aer
        purpose: Pilot with genuine per-shot Aer sampling (also the wall-clock timing study)
        sampling_mode: aer
        instances: [bell_cx, ghz_4, qaoa_n4_p1]
        noise: [{base: moderate}, {base: high}]
        shots: pilot
      - name: pilot_exact
        purpose: Identical design with exact-distribution sampling, for mode-equivalence checks
        sampling_mode: exact
        instances: [bell_cx, ghz_4, qaoa_n4_p1]
        noise: [{base: moderate}, {base: high}]
        shots: pilot

  standard:
    repetitions: 30
    blocks:
      - name: core
        purpose: Core grid (RQ1-RQ6) -- instance x noise level x shot budget
        instances: [bell_cx, bell_cz, bell_cx_pad2, ghz_3, ghz_4, ghz_5, ghz_6, ghz_8,
                    qaoa_n4_p1, qaoa_n4_p2, qaoa_n6_p1, qaoa_n6_p2]
        noise: [{base: low}, {base: moderate}, {base: high}]
        shots: all
      - name: readout_sweep
        purpose: RQ1/H1 -- readout error varied at fixed moderate gate noise
        instances: [bell_cx, ghz_4, ghz_6, qaoa_n4_p1]
        noise:
          - {base: moderate, readout_multiplier: 0.0, label: ro_x0}
          - {base: moderate, readout_multiplier: 0.25, label: ro_x0.25}
          - {base: moderate, readout_multiplier: 0.5, label: ro_x0.5}
          - {base: moderate, readout_multiplier: 1.0, label: ro_x1}
          - {base: moderate, readout_multiplier: 1.5, label: ro_x1.5}
          - {base: moderate, readout_multiplier: 2.5, label: ro_x2.5}
          - {base: moderate, readout_multiplier: 4.0, label: ro_x4}
          - {base: moderate, readout_multiplier: 6.0, label: ro_x6}
        shots: sweep
      - name: gate_sweep
        purpose: RQ2/H2 -- gate noise varied at fixed moderate readout noise
        instances: [bell_cx, ghz_4, ghz_6, qaoa_n4_p1]
        noise:
          - {base: moderate, gate_multiplier: 0.0, label: g_x0}
          - {base: moderate, gate_multiplier: 0.5, label: g_x0.5}
          - {base: moderate, gate_multiplier: 1.0, label: g_x1}
          - {base: moderate, gate_multiplier: 2.0, label: g_x2}
          - {base: moderate, gate_multiplier: 3.0, label: g_x3}
          - {base: moderate, gate_multiplier: 4.0, label: g_x4}
          - {base: moderate, gate_multiplier: 6.0, label: g_x6}
        shots: sweep
      - name: noise_variants
        purpose: Sensitivity to the noise-model form (symmetric readout, T1/T2 relaxation)
        instances: [ghz_4, qaoa_n4_p1]
        noise: [{base: moderate_symmetric}, {base: moderate_thermal}]
        shots: zne_design
      - name: zne_local_135
        purpose: ZNE design -- local folding, scales 1,3,5
        instances: [ghz_4, ghz_6, qaoa_n4_p1]
        noise: [{base: moderate}, {base: high}]
        shots: zne_design
        zne: {scale_factors: [1.0, 3.0, 5.0], folding: local}
      - name: zne_global_123
        purpose: ZNE design -- partial global folding, scales 1,2,3
        instances: [ghz_4, ghz_6, qaoa_n4_p1]
        noise: [{base: moderate}, {base: high}]
        shots: zne_design
        zne: {scale_factors: [1.0, 2.0, 3.0], folding: global}
      - name: zne_global_1357
        purpose: ZNE design -- global folding, scales 1,3,5,7
        instances: [ghz_4, ghz_6, qaoa_n4_p1]
        noise: [{base: moderate}, {base: high}]
        shots: zne_design
        zne: {scale_factors: [1.0, 3.0, 5.0, 7.0], folding: global}

  full:
    # Research-scale design (documented; NOT executed in the reported study -- see paper Sec. 8).
    repetitions: 100
    blocks:
      - name: core
        purpose: Full core grid incl. depth-padded Bell
        instances: [bell_cx, bell_cz, bell_cx_pad2, bell_cx_pad4, ghz_3, ghz_4, ghz_5, ghz_6, ghz_8,
                    qaoa_n4_p1, qaoa_n4_p2, qaoa_n6_p1, qaoa_n6_p2]
        noise: [{base: low}, {base: moderate}, {base: high}, {base: moderate_symmetric}, {base: moderate_thermal}]
        shots: all
      - name: readout_sweep
        purpose: Readout sweep at all budgets
        instances: [bell_cx, ghz_4, ghz_6, ghz_8, qaoa_n4_p1, qaoa_n6_p1]
        noise:
          - {base: moderate, readout_multiplier: 0.0, label: ro_x0}
          - {base: moderate, readout_multiplier: 0.5, label: ro_x0.5}
          - {base: moderate, readout_multiplier: 1.0, label: ro_x1}
          - {base: moderate, readout_multiplier: 2.5, label: ro_x2.5}
          - {base: moderate, readout_multiplier: 6.0, label: ro_x6}
        shots: all
